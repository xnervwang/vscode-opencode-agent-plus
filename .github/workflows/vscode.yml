# Runs the window tests of test/vscode/run.js on Linux, macOS and Windows, with test/vscode/fake-backend.js in place of
# OpenCode. Each system downloads the VS Code version set in run.js, installs this extension and Agent Plus, which it
# depends on, from .vsix files built once on Linux, and runs the tests once as usual and once in Restricted Mode. Runs
# against a real model need credentials and stay on a developer's machine. The results folder of each system is kept
# whether the run passed or not: the screenshots of every step, VS Code's logs, and for each check that failed what the
# window held then (its failures/ folder).
#
# What it installs from elsewhere is pinned in .github/upstream.json: the Agent Plus commit it builds, and the versions of
# the test runner's packages; VS Code's version is in run.js. A new Agent Plus is taken by changing that commit. Run with
# `upstream: latest` (against-latest.yml does so once a day), it builds Agent Plus's default branch and installs VS Code
# stable and the newest test runner instead.
name: vscode

on:
  push:
    branches: [main]
  pull_request:
  # By hand: one system or all three, and with `steps` only the window test steps whose names match that regular
  # expression, with the steps they rely on (test/vscode/lib/steps.js). Used to try a fix of one failure on the system it
  # failed on, from a branch.
  workflow_dispatch:
    inputs:
      os:
        description: The system to run on
        type: choice
        options: [all, ubuntu-latest, macos-latest, windows-latest]
        default: all
      steps:
        description: A regular expression of window test step names to run; empty runs them all
        type: string
        default: ''
      times:
        description: How many times to run them on each system
        type: choice
        options: ['1', '2', '3', '5']
        default: '1'
      upstream:
        description: The pinned Agent Plus, VS Code and test runner, or the latest of each
        type: choice
        options: [pinned, latest]
        default: pinned
  workflow_call:
    inputs:
      upstream:
        type: string
        default: pinned

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the run-time packages
        run: npm ci --ignore-scripts
      - name: Build the .vsix
        run: node build/pack-vsix.js . --out extension.vsix
      - name: Pick the Agent Plus commit
        id: pick
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          if [ "$UPSTREAM" = latest ]; then echo "agent-plus=" >> "$GITHUB_OUTPUT"
          else echo "agent-plus=$(node -p "require('./.github/upstream.json').agentPlus")" >> "$GITHUB_OUTPUT"; fi
      # An empty ref is the default branch.
      - uses: actions/checkout@v7
        with:
          repository: xnervwang/vscode-agent-plus
          ref: ${{ steps.pick.outputs.agent-plus }}
          path: agent-plus
      - name: Name the Agent Plus commit
        shell: bash
        run: git -C agent-plus log -1 --format='Agent Plus %H %s'
      - name: Build Agent Plus's .vsix
        shell: bash
        run: |
          core=$(cd agent-plus && bash build/pack.sh | tail -n 1)
          mv "$core" core.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            extension.vsix
            core.vsix

  run:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        round: ${{ fromJSON(inputs.times == '5' && '[1, 2, 3, 4, 5]' || inputs.times == '3' && '[1, 2, 3]' || inputs.times == '2' && '[1, 2]' || '[1]') }}
    name: "run (${{ matrix.os }}${{ matrix.round > 1 && format(' #{0}', matrix.round) || '' }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      OPENCODE_AGENT_PLUS_UI_STEPS: ${{ inputs.steps }}
      OPENCODE_AGENT_PLUS_VSCODE_VERSION: ${{ inputs.upstream == 'latest' && 'stable' || '' }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      # The run drives VS Code's Electron, so playwright-core is enough and no browser is downloaded.
      - name: Install the test runner
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          if [ "$UPSTREAM" = latest ]; then set -- @vscode/test-electron@latest playwright-core@latest
          else set -- "@vscode/test-electron@$(node -p "require('./.github/upstream.json').testElectron")" "playwright-core@$(node -p "require('./.github/upstream.json').playwrightCore")"; fi
          npm install --no-save --no-package-lock --ignore-scripts "$@"
          for p in @vscode/test-electron playwright-core; do echo "$p $(node -p "require('./node_modules/$p/package.json').version")"; done
      # Without a CJK font the 「」 in one of the window test's replies are drawn as boxes in the screenshots.
      - name: Install a CJK font
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
      # The Windows runner's screen is 1024 by 768, smaller than the 1440 by 900 window VS Code opens on a folder. run.js
      # prints the size the window got.
      - name: Make the screen larger
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run with the fake backend
        shell: bash
        run: node test/vscode/run.js --vsix extension.vsix --agent-plus core.vsix --out vscode-results/fake
      - name: Run in Restricted Mode
        if: ${{ !cancelled() }}
        shell: bash
        run: node test/vscode/run.js --restricted --vsix extension.vsix --agent-plus core.vsix --out vscode-results/restricted
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-${{ runner.os }}${{ matrix.round > 1 && format('-{0}', matrix.round) || '' }}
          path: vscode-results
          if-no-files-found: warn
